src = ["server", "tests"]
extend-exclude = ["docs/fase5/normativas", "docs/fase7/normativas"]  # copias byte a byte de las normativas; la prueba viva está en tests/
line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]

# Fichero normativo (se copia tal cual del plan, no se edita): solo se exime del estilo.
[lint.per-file-ignores]
"tests/test_fase2.py" = ["E501", "B905"]
"tests/test_fase2_plazo.py" = ["E501"]
"tests/test_fase4.py" = ["E501", "B905"]
"tests/test_fase5.py" = ["E501", "B905"]
"tests/test_fase7_h1.py" = ["E501", "B905"]
"tests/test_fase7_h2.py" = ["E501", "I001", "B905"]
"tests/test_memoria_bd.py" = ["E501"]
