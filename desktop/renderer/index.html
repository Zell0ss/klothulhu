<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- D10: nada de red ni eval. 'self' solo para cargar vendor/ y scenes.js; el SVG entra como <img> por img-src data: -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Klothulhu</title>
<style>
  :root { --rust: #b45032; --ink: #f3efe8; --box: rgba(26, 20, 18, 0.9); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: row; align-items: flex-start; }
  #col { display: flex; flex-direction: column; align-items: center; flex: none; }
  #stage { position: relative; flex: none; }
  #scene { display: block; }
  #copyBtn, #closeBtn, #histBtn {
    position: absolute; top: 4px; width: 18px; height: 18px; padding: 0;
    border: none; border-radius: 4px; background: rgba(26, 20, 18, 0.7); color: var(--ink);
    font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; opacity: 0.7;
  }
  #histBtn { right: 48px; }
  #histBtn:hover { opacity: 1; background: rgba(180, 80, 50, 0.8); }
  #copyBtn { right: 26px; display: none; }
  #copyBtn:hover { opacity: 1; background: rgba(180, 80, 50, 0.8); }
  #copyBtn.copied { background: #4a7c4e; opacity: 1; }
  #closeBtn { right: 4px; }
  #closeBtn:hover { opacity: 1; background: rgba(200, 60, 60, 0.85); }
  #ask {
    visibility: hidden; box-sizing: border-box; width: calc(100% - 16px); height: 32px; margin-top: 6px;
    padding: 0 10px; border: 2px solid var(--rust); border-radius: 6px; background: var(--box); color: var(--ink);
    font: 13px ui-monospace, Consolas, monospace; outline: none;
  }
  #ask.on { visibility: visible; }
  #history {
    display: none; flex: none; box-sizing: border-box; height: 100%; padding: 8px 10px;
    overflow-y: auto; border: 2px solid var(--rust); border-radius: 6px; background: var(--box); color: var(--ink);
    font: 12px/1.4 ui-monospace, Consolas, monospace; user-select: text;
  }
  #history .turn { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #history .who { color: var(--rust); font-weight: bold; }
  #ask::placeholder { color: rgba(243, 239, 232, 0.45); }
</style>
</head>
<body>
<div id="col">
<div id="stage">
  <img id="scene" alt="" draggable="false">
  <button id="histBtn" type="button" title="Historial" aria-label="Historial">📜</button>
  <button id="copyBtn" type="button" title="Copiar" aria-label="Copiar">📋</button>
  <button id="closeBtn" type="button" title="Cerrar Klothulhu" aria-label="Cerrar Klothulhu">✕</button>
</div>
<input id="ask" maxlength="1000" placeholder="Habla, mortal…" autocomplete="off" spellcheck="false">
</div>
<div id="history"></div>
<script src="vendor/fables-motor.iife.js"></script>
<script src="scenes.js"></script>
<script src="feed.js"></script>
<script src="convo.js"></script>
<script>
'use strict';
const { renderScene, VOCAB } = window.FablesMotor;
const { sceneFor, bootScenes, holdMs, secondsPerChar, BUBBLE_LINES, LINES, CAPTION_MAX } = window.KlScenes;
const { createFeed } = window.KlFeed;
const { createConvo } = window.KlConvo;

const STAGE_W = 640, STAGE_H = 128;   // lo que devuelve el motor (D12)
const LINGER_MS = 30000;              // LINGER_MS de upstream: tras la última escena, antes de dormir

const stage = document.getElementById('stage');
const sceneImg = document.getElementById('scene');
const input = document.getElementById('ask');
const col = document.getElementById('col');
const historyPanel = document.getElementById('history');
const histBtn = document.getElementById('histBtn');
const copyBtn = document.getElementById('copyBtn');
const closeBtn = document.getElementById('closeBtn');

const warnedNow = new Set();   // se vacía en cada ask()
let look = VOCAB.defaults.look;
let lookWarned = false;
let readSpeed = 1;  // config.json "readSpeed": mueve la escritura y el scroll del bocadillo (D25)
let debug = false;   // config.json "debug": true -> las medidas también van a un fichero de log (D20)

// Siempre a la consola; con debug, también al log del proceso principal.
function note(line) {
  console.info('[klothulhu]', line);
  if (debug) kl.debug(line);
}

// --- painting ---------------------------------------------------------------

// Devuelve { speaksAfter, typedAfter, spc } o null si no se pudo pintar (entonces se queda la escena anterior).
function paint(scene, fadeIn) {
  const spc = secondsPerChar(readSpeed, VOCAB.defaults.secondsPerChar);
  const opts = () => ({ look, fadeIn, bubble: { lines: BUBBLE_LINES }, secondsPerChar: spc });   // D25
  let r = renderScene(scene, opts());
  if (!r.ok && look !== VOCAB.defaults.look) {
    if (!lookWarned) { console.warn(`look "${look}" no válido (${r.error}); uso "${VOCAB.defaults.look}"`); lookWarned = true; }
    look = VOCAB.defaults.look;
    r = renderScene(scene, opts());
  }
  if (!r.ok) { console.warn(`renderScene falló: ${r.error}`); return null; }
  // Avisos del motor (p. ej. props-not-drawn con un look 3D): una vez por aviso y respuesta.
  for (const w of r.warnings || []) {
    if (!warnedNow.has(w)) { warnedNow.add(w); console.warn(`motor: ${w}`); if (debug) kl.debug(`warning ${w}`); }
  }
  // El SVG entra como imagen, no como DOM (D10). Asignar el mismo src reinicia la animación, así que solo se asigna si cambia.
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg);
  if (sceneImg.getAttribute('src') !== src) sceneImg.src = src;
  return { speaksAfter: r.speaksAfter, typedAfter: r.typedAfter, spc };
}

// --- director: cola de escenas ---------------------------------------------

// phase: 'reading' (hay un temporizador de lectura) | 'thinking' | 'lingering' | 'idle'
let phase = 'idle';
let timer = null;
let queue = [];
let lastBackdrop = null;

// Pinta un item de la cola: la escena del servidor si la hay y el motor la acepta; si no, la fija (D21.2).
// Devuelve { hold (ms que se queda en pantalla), source ('server' | 'fixed') } o false si no se pudo pintar.
function play(item) {
  const fixed = () => sceneFor(item.kind, item.caption, item.tone ? { tone: item.tone } : undefined);
  let scene = item.scene || fixed();
  let source = item.scene ? 'server' : 'fixed';
  const prev = lastBackdrop;
  let fadeIn = prev !== null && scene.backdrop !== prev;
  let shown = paint(scene, fadeIn);
  if (!shown && item.scene) {
    scene = fixed(); source = 'fixed';
    fadeIn = prev !== null && scene.backdrop !== prev;
    shown = paint(scene, fadeIn);
  }
  if (!shown) return false;
  lastBackdrop = scene.backdrop;
  return { hold: holdMs(shown.typedAfter, shown.spc), source };
}

function pump() {
  clearTimeout(timer); timer = null;
  while (queue.length) {
    const item = queue.shift();
    const shown = play(item);
    if (shown === false) continue;
    if (item.fromServer && firstSceneAt === null) {
      firstSceneAt = performance.now();
      note(`first-scene ms=${Math.round(firstSceneAt - t0)} director=${item.scene ? 1 : 0} painted=${shown.source}`);
    }
    phase = 'reading';
    timer = setTimeout(pump, shown.hold);
    return;
  }
  // Cola vacía y última escena leída: espera y duerme.
  phase = 'lingering';
  timer = setTimeout(() => {
    play({ kind: 'idle', caption: LINES.idle });
    phase = 'idle'; timer = null;
  }, LINGER_MS);
}

function enqueue(items) {
  queue.push(...items);
  if (phase !== 'reading') pump();  // si se está leyendo una escena, esta espera su turno
}

function think() {
  clearTimeout(timer); timer = null;
  queue = [];
  play({ kind: 'thinking', caption: LINES.thinking });
  phase = 'thinking';
}

// --- conversation -----------------------------------------------------------

let feed = createFeed(); // qué entra en la cola para la respuesta en curso (feed.js, D21)
let t0 = 0;              // performance.now() al pulsar Enter
let firstSceneAt = null; // cuándo se pintó la primera escena del servidor (null = aún no)
let reply = '';          // la respuesta entera, sin etiquetas
let marks = [];          // [{at, emotion}]
let awaiting = false;

// --- historial (D27): la conversación de esta sesión, en memoria; no se guarda en disco ---
const convo = createConvo();
let historyOpen = false;

function renderHistory() {
  if (!historyOpen) return;
  historyPanel.replaceChildren(...convo.entries().map((e) => {
    const turn = document.createElement('div');
    turn.className = 'turn';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = e.role === 'user' ? 'tú: ' : 'klothulhu: ';
    const text = document.createElement('span');
    text.textContent = e.text;   // nunca HTML (D10)
    turn.append(who, text);
    return turn;
  }));
  historyPanel.scrollTop = historyPanel.scrollHeight;
}

// Mostrar el panel solo después de que la ventana haya crecido, para que no salga aplastado; al cerrar, al revés.
async function toggleHistory() {
  if (!historyOpen) {
    await kl.panel(true);
    historyOpen = true;
    historyPanel.style.display = 'block';
    renderHistory();
  } else {
    historyOpen = false;
    historyPanel.style.display = 'none';
    await kl.panel(false);
  }
}

function ask(text) {
  convo.add('user', text); renderHistory();
  reply = ''; marks = []; awaiting = true;
  feed = createFeed(); warnedNow.clear(); firstSceneAt = null; t0 = performance.now();
  copyBtn.style.display = 'none';
  think();
  kl.ask(text);
}

kl.onEvent(({ type, data }) => {
  if (type === 'emotion') {
    const e = KlScenes.EMOTIONS.includes(data.emotion) ? data.emotion : 'neutral';
    marks.push({ at: marks.length ? reply.length : 0, emotion: e });
  } else if (type === 'delta') {
    reply += data.text;
  } else if (type === 'scene') {
    const item = feed.onScene(data);
    if (item) enqueue([item]);   // en cuanto llega: la primera sustituye a «pensando» (D21.1)
  } else if (type === 'done') {
    awaiting = false;
    note(`done ms=${Math.round(performance.now() - t0)} scenes=${feed.count}`);
    // Siempre se llama a enqueue, aunque no haya nada: con una respuesta vacía saca al cliente de «pensando».
    enqueue(feed.onDone(reply, marks));
    copyBtn.style.display = reply ? 'block' : 'none';
    convo.add('klothulhu', reply); renderHistory();
  } else if (type === 'error') {
    awaiting = false;
    feed.onError();
    const known = Object.prototype.hasOwnProperty.call(LINES.errors, data.code);
    const [kind, text] = known
      ? LINES.errors[data.code]
      : ['confused', `Error desconocido: ${data.code}`.slice(0, CAPTION_MAX)];
    queue = [];  // la del error espera a que se lea la que está en pantalla
    enqueue([{ kind, caption: text, tone: 'trouble' }]);
  }
});

// --- copy / close -----------------------------------------------------------

copyBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  kl.copy(reply);  // la respuesta entera, no el caption visible
  copyBtn.classList.add('copied');
  copyBtn.textContent = '✅';
  clearTimeout(copyBtn._resetT);
  copyBtn._resetT = setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.textContent = '📋'; }, 1200);
});

histBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleHistory();
});

kl.onForgotten(() => { convo.clear(); renderHistory(); });

closeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  kl.quit();
});

// --- pointer: click-through, drag, click (D12: toda la franja es interactiva) --

let interactive = false, press = null, dragging = false;

function setInteractive(on) {
  if (on !== interactive) { interactive = on; kl.clickThrough(!on); }
}

const onStrip = (t) => stage.contains(t) || historyPanel.contains(t);   // el panel de historial también (D27)
const onButton = (t) => t === copyBtn || t === closeBtn || t === histBtn;

window.addEventListener('mousemove', (e) => {
  if (press && !dragging && Math.hypot(e.screenX - press.x, e.screenY - press.y) > 4) {
    dragging = true; kl.dragStart();
  }
  if (!press) {
    const overInput = e.target === input && input.classList.contains('on');
    setInteractive(overInput || onStrip(e.target));
  }
});
window.addEventListener('mouseleave', () => { if (!press) setInteractive(false); });
stage.addEventListener('mousedown', (e) => {
  if (e.button === 0 && !onButton(e.target)) press = { x: e.screenX, y: e.screenY };
});
window.addEventListener('mouseup', () => {
  if (!press) return;
  if (dragging) kl.dragEnd(); else toggleInput();
  press = null; dragging = false;
});
window.addEventListener('blur', () => { if (dragging) kl.dragEnd(); press = null; dragging = false; });

function toggleInput(force) {
  const on = force ?? !input.classList.contains('on');
  input.classList.toggle('on', on);
  if (on) input.focus(); else input.blur();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleInput(false);
  if (e.key === 'Enter' && input.value.trim() && !awaiting) {
    ask(input.value.trim());
    input.value = '';
    toggleInput(false);
  }
});
kl.onSummon(() => toggleInput(true));

// --- boot -------------------------------------------------------------------

kl.init().then((cfg) => {
  look = cfg.look || VOCAB.defaults.look;
  debug = Boolean(cfg.debug);
  readSpeed = cfg.readSpeed;
  const w = `${STAGE_W * cfg.scale}px`, h = `${STAGE_H * cfg.scale}px`;
  col.style.width = w;
  historyPanel.style.width = `${cfg.panelW * cfg.scale}px`;
  stage.style.width = w; stage.style.height = h;
  sceneImg.style.width = w; sceneImg.style.height = h;
  enqueue(bootScenes(cfg.hotkey));
});
</script>
</body>
</html>
