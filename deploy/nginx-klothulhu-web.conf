# Sitio nginx del cliente web de klothulhu para el móvil, en :5757 (D50, docs/fase9/PLAN.md §2).
# Solo Tailscale (100.64.0.0/10, el CGNAT de Tailscale) y loopback; nada público. Instalación: deploy/PASOS-CON-SUDO.md.
#
# Sin TLS (como tristras, D34): no hay PWA ni service worker, y no se necesita contexto seguro.
#
# Mismo origen para la web y la API: el servidor (100.87.64.121:8765) no necesita CORS ni cambios.
# Se sirve SOLO lo de aquí abajo: nunca el repo entero, ni desktop/ entero, ni el servidor ni su configuración.
server {
    listen 5757;
    listen [::]:5757;
    server_name _;

    # MagicDNS resuelve seb01 también por IPv6 (fd7a:115c:a1e0::/48): sin esto el móvil puede entrar por ahí
    # y llevarse un 403 aunque 100.64.0.0/10 esté permitido (lección de tristras, H7-revision.md #2).
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Módulos JS sin build ni nombres con hash: que el móvil revalide con el ETag y no mezcle un app.js nuevo
    # con un host.js viejo cacheado. Va aquí, a nivel de server, y no en cada location: un add_header dentro
    # de un location anula los del nivel superior.
    add_header Cache-Control "no-cache";

    root /data/klothulhu/web;
    index index.html;

    # La API: /api/chat -> /chat, /api/history -> /history (la barra final de proxy_pass quita /api).
    # El chat es SSE: sin búfer, sin compresión, HTTP/1.1 y una lectura larga (el servidor tarda en contestar).
    location /api/ {
        proxy_pass http://100.87.64.121:8765/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # Lo compartido con el escritorio: el motor (vendor/), scenes.js, feed.js, convo.js y avatar.js.
    location /shared/ {
        alias /data/klothulhu/desktop/renderer/;
    }

    # El cliente SSE vive en desktop/, no en renderer/: se sirve él solo, no la carpeta.
    location = /shared/sse-client.js {
        alias /data/klothulhu/desktop/sse-client.js;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
